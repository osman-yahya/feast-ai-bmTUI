[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feast-ai"
version = "1.0.0"
description = "feast AI - a TUI lab for chatting with edge-optimized LLMs on a CPU inference engine, with live edge-device telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Osman Yahya Akinci" }]
keywords = ["llm", "edge-ai", "slm", "llama.cpp", "tui", "benchmark", "turkish"]

dependencies = [
    "textual>=1.0",
    "psutil>=5.9",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["textual-dev>=1.5"]
# The ONNX backend is optional: without it the llama.cpp engine
# still works and ONNX catalog entries report it as missing.
onnx = ["onnxruntime-genai>=0.14"]
# The intent router behind agent_mode "hierarchical" (ModernBERT-TR, int8 ONNX).
router = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=1.26"]

[project.scripts]
feast-ai = "feast_ai.cli:main"

[tool.setuptools.packages.find]
include = ["feast_ai*"]

[tool.setuptools.package-data]
feast_ai = ["ui/*.tcss"]
